name: 功能建议
description: 想要新功能或改进？说说你的想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！不过先说明本项目的一条底线：
        **不会加入任何联网、上传、统计、账号相关的功能**，这是设计原则，不是没做。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接说方案
      placeholder: 例如：我同时用两个显示器，提醒只在主屏出现，副屏还能看到游戏
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我理解本项目只用 Python 标准库、不引入第三方依赖
          required: true
        - label: 我理解本项目永远不联网
          required: true
